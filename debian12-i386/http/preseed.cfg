d-i keyboard-configuration/xkb-keymap select us
d-i time/zone string Etc/UTC
d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/add-kernel-opts string net.ifnames=0 biosdevname=0 systemd.unified_cgroup_hierarchy=1 rseq=0
d-i finish-install/reboot_in_progress note
d-i grub-installer/bootdev string default
d-i cdrom-detect/eject boolean false

d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

d-i passwd/root-login boolean true
d-i passwd/root-password password vagrant
d-i passwd/root-password-again password vagrant
d-i passwd/user-fullname string vagrant
d-i passwd/user-uid string 1000
d-i passwd/user-password password vagrant
d-i passwd/user-password-again password vagrant
d-i passwd/username string vagrant
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false
d-i netcfg/hostname string debian12

tasksel tasksel/first multiselect standard
d-i pkgsel/install-language-support boolean false
d-i pkgsel/language-packs multiselect en
d-i pkgsel/update-policy select none
d-i pkgsel/upgrade select full-upgrade
d-i pkgsel/include string \
    cloud-guest-utils \
    cloud-init \
    extlinux \
    openssh-server \
    sudo \
    syslinux-common

d-i mirror/protocol string http
d-i mirror/http/proxy string
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian

d-i preseed/late_command string in-target /bin/bash -c ' \
    echo "root:vagrant" | chpasswd; \
    mkdir -p /root/.ssh; \
    chmod 0700 /root/.ssh; \
    echo "ssh-rsa  vagrant insecure public key" > /root/.ssh/authorized_keys; \
    chmod 0600 /root/.ssh/authorized_keys; \
    mkdir -p /home/vagrant/.ssh; \
    chmod 0700 /home/vagrant/.ssh; \
    cp /root/.ssh/authorized_keys /home/vagrant/.ssh/authorized_keys; \
    chmod 0600 /home/vagrant/.ssh/authorized_keys; \
    chown -R vagrant:vagrant /home/vagrant/.ssh; \
    echo "vagrant ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/vagrant; \
    chmod 0440 /etc/sudoers.d/vagrant; \
    sed -i "s/^[#[:space:]]*UseDNS.*/UseDNS no/g" /etc/ssh/sshd_config; \
    sed -i "s/ens3/eth0/g; s/enp0s3/eth0/g" /etc/network/interfaces; \
    ssh-keygen -A; \
    systemctl enable ssh.service; \
    extlinux --install /boot; \
    ROOTUUID=$(blkid -s UUID -o value /dev/sda1); \
    KERNEL=$(basename $(ls /boot/vmlinuz-* | sort -V | tail -1)); \
    INITRD=$(basename $(ls /boot/initrd.img-* | sort -V | tail -1)); \
    printf "DEFAULT debian\nLABEL debian\n  KERNEL /boot/%s\n  APPEND root=UUID=%s ro net.ifnames=0 biosdevname=0 rseq=0 console=tty0 console=ttyS0,115200\n  INITRD /boot/%s\n" "$KERNEL" "$ROOTUUID" "$INITRD" > /boot/extlinux.conf; \
    dd if=/usr/lib/syslinux/mbr/mbr.bin of=/dev/sda bs=440 count=1; \
    echo virtio_net >> /etc/initramfs-tools/modules; \
    echo virtio_pci >> /etc/initramfs-tools/modules; \
    echo virtio_blk >> /etc/initramfs-tools/modules; \
    update-initramfs -c -k all; \
    systemctl disable apt-daily.service apt-daily.timer apt-daily-upgrade.service apt-daily-upgrade.timer; \
    exit 0 \
'
