name: Build Debian 12 i386 Vagrant Box

on:
  workflow_dispatch:
  push:
    paths:
      - 'debian12-i386/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: debian12-i386

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Print host CPU info
        run: |
          lscpu
          cat /proc/cpuinfo | head -30

      - name: Install dependencies
        run: |
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils vagrant packer hcp
          sudo chmod 666 /dev/kvm

      - name: Cache ISO
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae #v5.0.5
        with:
          path: ~/.cache/packer/debian-12-i386.iso
          key: debian-12.12.0-i386-netinst-iso
          save-always: true

      - name: Download ISO
        run: |
          mkdir -p ~/.cache/packer
          if [ ! -f ~/.cache/packer/debian-12-i386.iso ]; then
            curl -fSL -o ~/.cache/packer/debian-12-i386.iso https://cdimage.debian.org/cdimage/archive/12.13.0/i386/iso-cd/debian-12.13.0-i386-netinst.iso
          fi
          echo "61e5dbec68c511713611ffec58e40ba26c76487864b7dddfc59f8e55bacbe56a  $HOME/.cache/packer/debian-12-i386.iso" | sha256sum -c

      - name: Init Packer plugins
        run: packer init debian12-i386.pkr.hcl

      - name: Build box
        run: PACKER_LOG=1 packer build -on-error=abort -var "iso_url=$HOME/.cache/packer/debian-12-i386.iso" debian12-i386.pkr.hcl

      - name: Upload box as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: debian12-i386-libvirt
          path: debian12-i386/debian12-i386-libvirt.box

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: serial-log
          path: debian12-i386/serial.log

      - name: Upload qcow2 on failure (for local inspection)
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: failed-qcow2
          path: debian12-i386/output-debian12-i386/packer-debian12-i386

      - name: Publish to HCP Vagrant Registry
        if: github.ref == 'refs/heads/main'
        env:
          HCP_CLIENT_ID: ${{ secrets.HCP_CLIENT_ID }}
          HCP_CLIENT_SECRET: ${{ secrets.HCP_CLIENT_SECRET }}
        run: |
          hcp auth login --client-id="$HCP_CLIENT_ID" --client-secret="$HCP_CLIENT_SECRET"
          vagrant cloud publish \
            --force \
            --release \
            DefinedNet/debian12-i386 \
            1.0.${{ github.run_number }} \
            libvirt \
            debian12-i386-libvirt.box
