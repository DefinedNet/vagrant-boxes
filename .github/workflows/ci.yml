name: CI

# The box builds take a long time and run on their own when their directory changes. This is the
# quick check every PR gets.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: shellcheck
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r shellcheck
      - name: packer fmt
        run: docker run --rm -v "$PWD:/repo" -w /repo hashicorp/packer:1.16.2@sha256:5aa2160b623fad0b99f8ae8d9cc162ba9775ae428367edca88addc01bb86dd52 fmt -check -recursive .

  ci-pass-fail:
    name: pass/fail check
    if: always()
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
