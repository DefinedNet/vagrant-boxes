name: Build OpenBSD 7.8 Vagrant Box

on:
  workflow_dispatch:
  push:
    paths:
      - 'openbsd78/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openbsd78

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Install dependencies
        run: |
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils vagrant packer hcp
          sudo chmod 666 /dev/kvm

      - name: Init Packer plugins
        run: packer init openbsd78.pkr.hcl

      - name: Cache ISO
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae #v5.0.5
        with:
          path: ~/.cache/packer/install78.iso
          key: openbsd-7.8-install-iso

      - name: Download ISO
        run: |
          mkdir -p ~/.cache/packer
          if [ ! -f ~/.cache/packer/install78.iso ]; then
            curl -fSL -o ~/.cache/packer/install78.iso https://cdn.openbsd.org/pub/OpenBSD/7.8/amd64/install78.iso
          fi
          echo "a228d0a1ef558b4d9ec84c698f0d3ffd13cd38c64149487cba0f1ad873be07b2  $HOME/.cache/packer/install78.iso" | sha256sum -c

      - name: Build box
        run: PACKER_LOG=1 packer build -var "iso_url=$HOME/.cache/packer/install78.iso" openbsd78.pkr.hcl

      - name: Upload box as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: openbsd78-libvirt
          path: openbsd78/openbsd78-libvirt.box

      - name: Publish to HCP Vagrant Registry
        if: github.ref == 'refs/heads/main'
        env:
          HCP_CLIENT_ID: ${{ secrets.HCP_CLIENT_ID }}
          HCP_CLIENT_SECRET: ${{ secrets.HCP_CLIENT_SECRET }}
        run: |
          hcp auth login --client-id="$HCP_CLIENT_ID" --client-secret="$HCP_CLIENT_SECRET"
          vagrant cloud publish \
            --force \
            --release \
            DefinedNet/openbsd78 \
            1.0.${{ github.run_number }} \
            libvirt \
            openbsd78-libvirt.box
