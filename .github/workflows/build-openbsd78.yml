name: Build OpenBSD 7.8 Vagrant Box

on:
  workflow_dispatch:
  push:
    paths:
      - 'openbsd78/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openbsd78

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Install dependencies
        run: |
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install -y virtualbox vagrant packer
          sudo modprobe -r kvm_amd kvm_intel kvm 2>/dev/null || true

      - name: Init Packer plugins
        run: packer init openbsd78.pkr.hcl

      - name: Build box
        run: packer build openbsd78.pkr.hcl

      - name: Upload box as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: openbsd78-virtualbox
          path: openbsd78/openbsd78-virtualbox.box

